<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy There - The all in one productivity app</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="app-brand">Easy There</span>
                <button id="sidebar-close" class="icon-button" aria-label="Close sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-item active" type="button">To-Do</button>
                <button class="nav-item" type="button">Calendar</button>
            </nav>
        </aside>
        <div class="main-wrapper">
            <header class="topbar">
                <button id="sidebar-toggle" class="icon-button" aria-label="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
            </header>
            <main class="container">
                <h1>Easy There</h1>
                <p class="subtitle">Hello user! Ready to start off the day?</p>
                <hr>
                <h2>To-Do</h2>
                <form id="todo-form">
                    <input id="todo-input" type="text" placeholder="Enter a task" required>
                    <button type="submit">Add To-Do</button>
                </form>
                <div id="todo-list"></div>
            </main>
        </div>
    </div>
    <script src="todo.js"></script>
    <script src="sidebar.js"></script>
</body>
</html>
