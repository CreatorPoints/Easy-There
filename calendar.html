<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy There - Calendar</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
    <script src="firebase-app.js"></script>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="app-brand">Easy There</span>
                <button id="sidebar-close" class="icon-button" aria-label="Close sidebar">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="/" class="nav-item">To-Do</a>
                <a href="/calendar" class="nav-item active">Calendar</a>
                <a href="/integrations" class="nav-item">Integrations</a>
            </nav>
        </aside>
        <div class="main-wrapper">
            <header class="topbar">
                <button id="sidebar-toggle" class="icon-button" aria-label="Toggle sidebar">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="12" x2="21" y2="12"></line>
                        <line x1="3" y1="6" x2="21" y2="6"></line>
                        <line x1="3" y1="18" x2="21" y2="18"></line>
                    </svg>
                </button>
                <div class="auth-topbar-slot"></div>
            </header>
            <main class="calendar-container">
                <div class="calendar-title-bar">
                    <h1>Calendar</h1>
                    <p class="subtitle">Manage dates and schedule events</p>
                </div>
                <hr>
                <div class="calendar-split-view">
                    <div class="calendar-left-col">
                        <div class="calendar-header">
                            <h2 id="calendar-month-year"></h2>
                            <div class="calendar-controls">
                                <button id="calendar-prev" class="icon-button" aria-label="Previous month">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="15 18 9 12 15 6"></polyline>
                                    </svg>
                                </button>
                                <button id="calendar-next" class="icon-button" aria-label="Next month">
                                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="calendar-weekdays">
                            <span>Su</span>
                            <span>Mo</span>
                            <span>Tu</span>
                            <span>We</span>
                            <span>Th</span>
                            <span>Fr</span>
                            <span>Sa</span>
                        </div>
                        <div id="calendar-days" class="calendar-days"></div>
                        <div class="calendar-add-section">
                            <form id="calendar-event-form">
                                <input id="calendar-event-input" type="text" aria-label="Event title" required>
                                <div class="event-time-row">
                                    <input id="calendar-event-start" type="time" value="09:00" aria-label="Start time">
                                    <span class="time-sep">to</span>
                                    <input id="calendar-event-end" type="time" value="10:00" aria-label="End time">
                                </div>
                                <button type="submit">Add Event</button>
                            </form>
                        </div>
                    </div>
                    <div class="calendar-right-col">
                        <div class="timeline-header">
                            <div class="timeline-title-wrap">
                                <h3 id="selected-date-heading"></h3>
                                <span id="timeline-mode-badge" class="timeline-mode-badge hidden">Preview</span>
                            </div>
                        </div>
                        <div id="all-day-events" class="all-day-events-wrap"></div>
                        <div class="day-timeline-scroll" id="day-timeline-scroll">
                            <div class="day-timeline-grid" id="day-timeline-grid"></div>
                        </div>
                    </div>
                </div>
            </main>
            <div class="ai-island-container" id="ai-island">
                <div class="ai-island-card hidden" id="ai-island-card">
                    <div class="ai-island-card-header">
                        <div class="ai-card-title-group">
                            <svg class="ai-sparkle-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
                            </svg>
                            <span class="ai-card-title">Easy There AI</span>
                        </div>
                        <button type="button" class="ai-card-close" id="ai-island-close" aria-label="Close response">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>
                    <div class="ai-island-card-body" id="ai-island-response"></div>
                </div>
                <form class="ai-island-pill" id="ai-island-form">
                    <div class="ai-island-left-icon">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z"/>
                        </svg>
                    </div>
                    <input type="text" class="ai-island-input" id="ai-island-input" aria-label="Ask AI or schedule" required autocomplete="off">
                    <button type="submit" class="ai-island-submit" id="ai-island-submit" aria-label="Send">
                        <svg class="ai-submit-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="12" y1="19" x2="12" y2="5"></line>
                            <polyline points="5 12 12 5 19 12"></polyline>
                        </svg>
                        <div class="ai-spinner hidden" id="ai-island-spinner"></div>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <script src="sidebar.js"></script>
    <script src="calendar.js"></script>
    <script src="ai-island.js"></script>
</body>
</html>
